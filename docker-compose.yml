version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: docnest-backend
    ports:
      - "8000:8000"
    environment:
      - DOCNEST_ENV=production
      - DOCNEST_API_HOST=0.0.0.0
      - DOCNEST_API_PORT=8000
      - DOCNEST_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      - DOCNEST_DOCUMENTS_DIR=backend/documents
      - DOCNEST_CHROMA_DIR=backend/chroma_db
      - DOCNEST_COLLECTION_NAME=docnest_collection
      - DOCNEST_EMBEDDING_MODEL=all-MiniLM-L6-v2
      - DOCNEST_CHUNK_SIZE=500
      - DOCNEST_CHUNK_OVERLAP=60
      - DOCNEST_RETRIEVAL_TOP_K=4
      - DOCNEST_SIMILARITY_THRESHOLD=0.25
      - DOCNEST_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DOCNEST_OLLAMA_MODEL=llama3.2
    volumes:
      - ./backend/documents:/app/backend/documents
      - ./backend/chroma_db:/app/backend/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docnest-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
